name: Package Kodi add-ons

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'jellyfin/**'
    paths:
      - 'addon.xml'
      - 'xml/**'
      - 'resources/**'
      - 'media/**'
      - 'colors/**'
      - 'extras/**'
      - 'fonts/**'
      - 'language/**'
      - 'playlists/**'
      - 'scripts/**'
      - 'themes/**'
      - '.github/workflows/package.yml'
      - '.github/helper_overrides/**'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Nimbus Jellyfin
        uses: actions/checkout@v4

      - name: Read skin metadata
        id: skin
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET
          root = ET.parse("addon.xml").getroot()
          print(f"id={root.attrib['id']}")
          print(f"version={root.attrib['version']}")
          PY

      - name: Validate skin XML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          errors = []
          for path in Path(".").rglob("*.xml"):
              if ".git" in path.parts or "build" in path.parts:
                  continue
              try:
                  ET.parse(path)
              except Exception as exc:
                  errors.append(f"{path}: {exc}")
          if errors:
              raise SystemExit("\n".join(errors))
          print("All skin XML files parsed successfully.")
          PY

      - name: Build skin ZIP
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/skin.nimbus
          rsync -a ./ build/skin.nimbus/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build'
          cd build
          zip -qr "skin.nimbus-${{ steps.skin.outputs.version }}.zip" skin.nimbus

      - name: Checkout upstream Nimbus helper
        uses: actions/checkout@v4
        with:
          repository: ivarbrandt/script.nimbus.helper
          path: helper

      - name: Patch helper for Jellyfin static preset
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("helper/resources/lib/modules/version_monitor.py")
          text = path.read_text(encoding="utf-8")

          old = "    if property_version == installed_version:\n        return\n    from modules.cpath_maker import remake_all_cpaths\n"
          new = '    if property_version == installed_version:\n        return\n    # Nimbus Jellyfin ships static menus/widgets; do not overwrite them after a skin update.\n    if xbmc.getCondVisibility("Skin.HasSetting(JellyfinMinimalHome)"):\n        return set_installed_version(skin_id, installed_version)\n    from modules.cpath_maker import remake_all_cpaths\n'
          if old not in text:
              raise SystemExit("check_for_update patch anchor not found")
          text = text.replace(old, new, 1)

          old = "    if saved_profile == current_profile:\n        return\n    from modules.cpath_maker import remake_all_cpaths\n"
          new = '    if saved_profile == current_profile:\n        return\n    # Preserve the static Jellyfin preset across Kodi profile switches too.\n    if xbmc.getCondVisibility("Skin.HasSetting(JellyfinMinimalHome)"):\n        return set_current_profile(skin_id, current_profile)\n    from modules.cpath_maker import remake_all_cpaths\n'
          if old not in text:
              raise SystemExit("check_for_profile_change patch anchor not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          # Add the local recommendation engine to the packaged Nimbus helper.
          recommendation_source = Path(".github/helper_overrides/jellyfin_recommendations.py")
          recommendation_target = Path("helper/resources/lib/modules/jellyfin_recommendations.py")
          recommendation_target.write_text(
              recommendation_source.read_text(encoding="utf-8"), encoding="utf-8"
          )

          service = Path("helper/resources/lib/service.py")
          service_text = service.read_text(encoding="utf-8")

          import_anchor = "from modules.config import SETTINGS_PATH\n"
          import_patch = (
              "from modules.config import SETTINGS_PATH\n"
              "from modules.jellyfin_recommendations import RecommendationEngine\n"
          )
          if import_anchor not in service_text:
              raise SystemExit("service import patch anchor not found")
          service_text = service_text.replace(import_anchor, import_patch, 1)

          init_anchor = "        self.ratings_monitor = RatingsMonitor(RatingsDatabase(), self.home_window)\n"
          init_patch = (
              "        self.ratings_monitor = RatingsMonitor(RatingsDatabase(), self.home_window)\n"
              "        self.jellyfin_recommendations = RecommendationEngine(self.home_window)\n"
              "        self.jellyfin_recommendations.refresh(force=True)\n"
          )
          if init_anchor not in service_text:
              raise SystemExit("service init patch anchor not found")
          service_text = service_text.replace(init_anchor, init_patch, 1)

          notify_anchor = '        if sender == "xbmc":\n'
          notify_patch = (
              '        if method == "VideoLibrary.OnUpdate":\n'
              "            self.jellyfin_recommendations.refresh()\n"
              '        elif method in ("VideoLibrary.OnScanFinished", "VideoLibrary.OnCleanFinished"):\n'
              "            # Completion must win over throttled update bursts so the final\n"
              "            # library state is always reflected in generated playlists.\n"
              "            self.jellyfin_recommendations.refresh(force=True)\n\n"
              '        if sender == "xbmc":\n'
          )
          if notify_anchor not in service_text:
              raise SystemExit("service notification patch anchor not found")
          service_text = service_text.replace(notify_anchor, notify_patch, 1)
          service.write_text(service_text, encoding="utf-8")

          addon = Path("helper/addon.xml")
          tree = ET.parse(addon)
          root = tree.getroot()
          version = root.attrib["version"]
          # .1 was the static-preset patch; .2 introduced movie recommendations.
          # Use .3 so existing recommendation builds upgrade to TV support too.
          if version.count(".") == 2:
              root.attrib["version"] = version + ".3"
          tree.write(addon, encoding="UTF-8", xml_declaration=True)
          PY

      - name: Validate patched helper Python
        shell: bash
        run: |
          python3 -m py_compile \
            helper/resources/lib/service.py \
            helper/resources/lib/modules/jellyfin_recommendations.py

      - name: Read helper metadata
        id: helper
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET
          root = ET.parse("helper/addon.xml").getroot()
          print(f"id={root.attrib['id']}")
          print(f"version={root.attrib['version']}")
          PY

      - name: Build helper ZIP
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/script.nimbus.helper
          rsync -a helper/ build/script.nimbus.helper/ --exclude '.git'
          cd build
          zip -qr "script.nimbus.helper-${{ steps.helper.outputs.version }}.zip" script.nimbus.helper

      - name: Upload test packages
        uses: actions/upload-artifact@v4
        with:
          name: nimbus-jellyfin-kodi-packages
          path: |
            build/skin.nimbus-${{ steps.skin.outputs.version }}.zip
            build/script.nimbus.helper-${{ steps.helper.outputs.version }}.zip
          if-no-files-found: error
