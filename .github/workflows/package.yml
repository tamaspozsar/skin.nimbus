name: Package Kodi add-ons

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'jellyfin/**'
    paths:
      - 'addon.xml'
      - 'xml/**'
      - 'resources/**'
      - 'media/**'
      - 'colors/**'
      - 'extras/**'
      - 'fonts/**'
      - 'language/**'
      - 'playlists/**'
      - 'scripts/**'
      - 'themes/**'
      - '.github/workflows/package.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Nimbus Jellyfin
        uses: actions/checkout@v4

      - name: Read skin metadata
        id: skin
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET
          root = ET.parse("addon.xml").getroot()
          print(f"id={root.attrib['id']}")
          print(f"version={root.attrib['version']}")
          PY

      - name: Validate skin XML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          errors = []
          for path in Path(".").rglob("*.xml"):
              if ".git" in path.parts or "build" in path.parts:
                  continue
              try:
                  ET.parse(path)
              except Exception as exc:
                  errors.append(f"{path}: {exc}")
          if errors:
              raise SystemExit("\n".join(errors))
          print("All skin XML files parsed successfully.")
          PY

      - name: Build skin ZIP
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/skin.nimbus
          rsync -a ./ build/skin.nimbus/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'build'
          cd build
          zip -qr "skin.nimbus-${{ steps.skin.outputs.version }}.zip" skin.nimbus

      - name: Checkout upstream Nimbus helper
        uses: actions/checkout@v4
        with:
          repository: ivarbrandt/script.nimbus.helper
          path: helper

      - name: Patch helper for Jellyfin static preset
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          path = Path("helper/resources/lib/modules/version_monitor.py")
          text = path.read_text(encoding="utf-8")

          old = '''    if property_version == installed_version:
        return
    from modules.cpath_maker import remake_all_cpaths
'''
          new = '''    if property_version == installed_version:
        return
    # Nimbus Jellyfin ships static menus/widgets. Rebuilding cpaths here would
    # overwrite them from the helper database immediately after a skin update.
    if xbmc.getCondVisibility("Skin.HasSetting(JellyfinMinimalHome)"):
        return set_installed_version(skin_id, installed_version)
    from modules.cpath_maker import remake_all_cpaths
'''
          if old not in text:
              raise SystemExit("check_for_update patch anchor not found")
          text = text.replace(old, new, 1)

          old = '''    if saved_profile == current_profile:
        return
    from modules.cpath_maker import remake_all_cpaths
'''
          new = '''    if saved_profile == current_profile:
        return
    # Preserve the static Jellyfin preset across Kodi profile switches too.
    if xbmc.getCondVisibility("Skin.HasSetting(JellyfinMinimalHome)"):
        return set_current_profile(skin_id, current_profile)
    from modules.cpath_maker import remake_all_cpaths
'''
          if old not in text:
              raise SystemExit("check_for_profile_change patch anchor not found")
          text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")

          addon = Path("helper/addon.xml")
          tree = ET.parse(addon)
          root = tree.getroot()
          version = root.attrib["version"]
          if not version.endswith(".1"):
              root.attrib["version"] = version + ".1"
          tree.write(addon, encoding="UTF-8", xml_declaration=True)
          PY

      - name: Read helper metadata
        id: helper
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import xml.etree.ElementTree as ET
          root = ET.parse("helper/addon.xml").getroot()
          print(f"id={root.attrib['id']}")
          print(f"version={root.attrib['version']}")
          PY

      - name: Build helper ZIP
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/script.nimbus.helper
          rsync -a helper/ build/script.nimbus.helper/ --exclude '.git'
          cd build
          zip -qr "script.nimbus.helper-${{ steps.helper.outputs.version }}.zip" script.nimbus.helper

      - name: Upload test packages
        uses: actions/upload-artifact@v4
        with:
          name: nimbus-jellyfin-kodi-packages
          path: |
            build/skin.nimbus-${{ steps.skin.outputs.version }}.zip
            build/script.nimbus.helper-${{ steps.helper.outputs.version }}.zip
          if-no-files-found: error
